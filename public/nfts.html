<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIPHER — NFT Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10; --bg2: #0e1118; --card: #111620; --card2: #181f2e;
    --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1);
    --cyan: #00f5c4; --cyan2: #00c9a7; --purple: #7b5ea7; --pink: #e040fb;
    --text: #e8eaf0; --muted: #5a6070; --muted2: #8892a4;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: linear-gradient(rgba(0,245,196,0.03) 1px,transparent 1px), linear-gradient(90deg,rgba(0,245,196,0.03) 1px,transparent 1px);
    background-size:40px 40px;
  }

  /* Sidebar — same as main dashboard */
  .sidebar {
    width:220px; position:fixed; height:100vh; left:0; top:0; z-index:10;
    background:rgba(14,17,24,0.9); border-right:1px solid var(--border);
    backdrop-filter:blur(20px); display:flex; flex-direction:column; padding:28px 0;
  }
  .logo { padding:0 24px 32px; display:flex; align-items:center; gap:10px; }
  .logo-icon svg { width:32px; height:32px; }
  .logo-text { font-family:'Syne',sans-serif; font-weight:800; font-size:18px; letter-spacing:0.15em; color:var(--cyan); }
  .nav-section { padding:0 12px; flex:1; }
  .nav-label { font-size:9px; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase; padding:0 12px; margin-bottom:8px; margin-top:20px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; transition:all 0.2s; color:var(--muted2); font-size:13px; text-decoration:none; position:relative; }
  .nav-item:hover { background:rgba(255,255,255,0.04); color:var(--text); }
  .nav-item.active { background:rgba(0,245,196,0.08); color:var(--cyan); }
  .nav-item.active::before { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:60%; background:var(--cyan); border-radius:0 2px 2px 0; }
  .nav-item svg { width:16px; height:16px; flex-shrink:0; }
  .badge { margin-left:auto; background:rgba(0,245,196,0.15); color:var(--cyan); font-size:9px; padding:2px 6px; border-radius:20px; }
  .sidebar-bottom { padding:20px 16px 0; border-top:1px solid var(--border); margin-top:auto; }
  .user-card { display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; background:var(--card2); border:1px solid var(--border); cursor:pointer; }
  .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--purple)); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:700; font-size:13px; color:var(--bg); flex-shrink:0; position:relative; }
  .avatar::after { content:''; position:absolute; bottom:1px; right:1px; width:8px; height:8px; background:#22c55e; border-radius:50%; border:2px solid var(--card2); }
  .user-name { font-family:'Syne',sans-serif; font-weight:600; font-size:12px; color:var(--text); }
  .user-role { font-size:10px; color:var(--muted2); }

  /* Main */
  .main { margin-left:220px; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1; max-width:calc(100vw - 220px); overflow-x:hidden; }

  /* Header */
  .page-header { padding:24px 28px 0; }
  .page-title { font-family:'Syne',sans-serif; font-weight:800; font-size:28px; color:var(--text); }
  .page-sub { font-size:12px; color:var(--muted2); margin-top:4px; }

  /* Stats bar */
  .stats-bar { display:flex; gap:12px; padding:20px 28px; flex-wrap:wrap; }
  .stat-pill {
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; display:flex; flex-direction:column; gap:3px; min-width:120px;
  }
  .stat-pill-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
  .stat-pill-value { font-family:'Syne',sans-serif; font-weight:700; font-size:18px; color:var(--text); }
  .stat-pill-sub { font-size:10px; color:var(--muted2); }

  /* Filter bar */
  .filter-bar { display:flex; align-items:center; gap:10px; padding:0 28px 20px; flex-wrap:wrap; }
  .filter-btn { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted2); font-family:'DM Mono',monospace; font-size:11px; cursor:pointer; transition:all 0.2s; }
  .filter-btn:hover { border-color:var(--border2); color:var(--text); }
  .filter-btn.active { background:rgba(0,245,196,0.08); border-color:rgba(0,245,196,0.3); color:var(--cyan); }
  .search-nft { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:7px 12px; margin-left:auto; }
  .search-nft input { background:none; border:none; outline:none; color:var(--text); font-family:'DM Mono',monospace; font-size:12px; width:180px; }
  .search-nft input::placeholder { color:var(--muted); }

  /* NFT Grid */
  .nft-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; padding:0 28px 40px; }

  .nft-card {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    overflow:hidden; cursor:pointer; transition:all 0.25s;
    animation:fadeUp 0.4s ease both;
  }
  .nft-card:hover { border-color:rgba(0,245,196,0.25); transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.4); }

  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  .nft-image { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--card2); }
  .nft-image-placeholder { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:48px; background:linear-gradient(135deg,var(--card2),var(--bg2)); }
  .nft-body { padding:12px; }
  .nft-collection { font-size:10px; color:var(--muted2); margin-bottom:3px; display:flex; align-items:center; gap:4px; }
  .nft-collection .verified { color:var(--cyan); }
  .nft-name { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; color:var(--text); margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nft-footer { display:flex; justify-content:space-between; align-items:flex-end; }
  .nft-floor-label { font-size:9px; color:var(--muted); text-transform:uppercase; }
  .nft-floor-value { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; color:var(--cyan); }
  .nft-actions { display:flex; gap:4px; }
  .nft-action-btn { width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted2); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
  .nft-action-btn:hover { border-color:var(--border2); color:var(--text); }

  /* Loading state */
  .loading-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; padding:0 28px 40px; }
  .skeleton { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .skeleton-img { width:100%; aspect-ratio:1; background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
  .skeleton-body { padding:12px; display:flex; flex-direction:column; gap:8px; }
  .skeleton-line { height:10px; border-radius:4px; background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
  .skeleton-line.short { width:60%; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Empty / Error state */
  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 40px; text-align:center; gap:14px; }
  .empty-state svg { opacity:0.2; }
  .empty-state h3 { font-family:'Syne',sans-serif; font-size:18px; color:var(--text); }
  .empty-state p { font-size:12px; color:var(--muted2); line-height:1.6; max-width:320px; }
  .empty-state code { background:var(--card); padding:2px 8px; border-radius:4px; font-size:11px; color:var(--cyan); }

  /* NFT Detail Modal */
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--bg2); border:1px solid var(--border2); border-radius:18px; max-width:800px; width:100%; max-height:90vh; overflow-y:auto; display:flex; flex-direction:column; animation:modalIn 0.3s ease; }
  @keyframes modalIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }
  .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; }
  .modal-img-side { position:relative; }
  .modal-img-side img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:18px 0 0 18px; display:block; }
  .modal-img-placeholder { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:80px; background:linear-gradient(135deg,var(--card2),var(--bg)); border-radius:18px 0 0 18px; }
  .modal-info { padding:24px; display:flex; flex-direction:column; gap:16px; overflow-y:auto; }
  .modal-close { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:8px; background:rgba(0,0,0,0.5); border:none; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; }
  .modal-collection { font-size:11px; color:var(--cyan); letter-spacing:0.05em; }
  .modal-name { font-family:'Syne',sans-serif; font-weight:800; font-size:22px; color:var(--text); line-height:1.2; }
  .modal-desc { font-size:11px; color:var(--muted2); line-height:1.6; }
  .modal-section-title { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.15em; margin-bottom:8px; }
  .traits-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .trait-pill { background:rgba(0,245,196,0.05); border:1px solid rgba(0,245,196,0.12); border-radius:8px; padding:7px 10px; }
  .trait-type { font-size:9px; color:var(--cyan); text-transform:uppercase; letter-spacing:0.1em; }
  .trait-value { font-family:'Syne',sans-serif; font-size:12px; color:var(--text); font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .price-row { display:flex; gap:10px; }
  .price-box { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .price-box-label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }
  .price-box-value { font-family:'Syne',sans-serif; font-weight:700; font-size:16px; color:var(--text); margin-top:3px; }
  .price-box-sub { font-size:10px; color:var(--muted2); margin-top:1px; }
  .modal-actions { display:flex; gap:8px; }
  .modal-btn { flex:1; padding:10px; border-radius:8px; font-family:'Syne',sans-serif; font-weight:600; font-size:12px; cursor:pointer; border:none; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
  .modal-btn.primary { background:var(--cyan); color:var(--bg); }
  .modal-btn.primary:hover { background:var(--cyan2); }
  .modal-btn.ghost { background:transparent; border:1px solid var(--border2); color:var(--muted2); }
  .modal-btn.ghost:hover { border-color:var(--cyan); color:var(--cyan); }
  .history-item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:11px; }
  .history-item:last-child { border-bottom:none; }
  .history-type { background:rgba(0,245,196,0.1); color:var(--cyan); padding:2px 7px; border-radius:4px; font-size:9px; text-transform:uppercase; }
  .history-price { font-family:'Syne',sans-serif; font-weight:700; color:var(--text); margin-left:auto; }
  .history-date { color:var(--muted); font-size:10px; }

  /* Collection stats row */
  .collection-stats { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .coll-stat { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 12px; flex:1; min-width:80px; }
  .coll-stat-label { font-size:9px; color:var(--muted); text-transform:uppercase; }
  .coll-stat-value { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; color:var(--text); margin-top:2px; }

  ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

  /* Toast */
  #toast-container { position:fixed; bottom:24px; right:24px; z-index:300; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast { background:var(--card); border:1px solid var(--border2); border-radius:10px; padding:12px 16px; display:flex; align-items:center; gap:10px; min-width:260px; pointer-events:all; animation:toastIn 0.3s ease; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
  @keyframes toastIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .toast-icon { width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
  .toast-title { font-family:'Syne',sans-serif; font-size:12px; font-weight:600; color:var(--text); }
  .toast-msg { font-size:11px; color:var(--muted2); margin-top:2px; }
</style>
</head>
<body>

<!-- Main -->
<div class="main">
  <div class="page-header">
    <h1 class="page-title">My NFTs</h1>
    <p class="page-sub" id="wallet-sub">Loading wallet...</p>
  </div>

  <!-- Stats bar -->
  <div class="stats-bar">
    <div class="stat-pill">
      <div class="stat-pill-label">Total NFTs</div>
      <div class="stat-pill-value" id="stat-total">—</div>
      <div class="stat-pill-sub">in wallet</div>
    </div>
    <div class="stat-pill">
      <div class="stat-pill-label">Collections</div>
      <div class="stat-pill-value" id="stat-collections">—</div>
      <div class="stat-pill-sub">unique</div>
    </div>
    <div class="stat-pill">
      <div class="stat-pill-label">Est. Value</div>
      <div class="stat-pill-value" id="stat-value">—</div>
      <div class="stat-pill-sub">floor × qty ETH</div>
    </div>
    <div class="stat-pill">
      <div class="stat-pill-label">Highest Floor</div>
      <div class="stat-pill-value" id="stat-floor">—</div>
      <div class="stat-pill-sub" id="stat-floor-name">—</div>
    </div>
    <div class="stat-pill" style="margin-left:auto; cursor:pointer; border-color:rgba(0,245,196,0.2);" onclick="loadNFTs()">
      <div class="stat-pill-label">Last Refresh</div>
      <div class="stat-pill-value" style="font-size:13px;" id="stat-refresh">—</div>
      <div class="stat-pill-sub" style="color:var(--cyan)">↺ click to refresh</div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterBy('all', this)">All</button>
    <div id="collection-filters"></div>
    <div class="search-nft">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5a6070" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Search NFTs..." oninput="searchNFTs(this.value)">
    </div>
  </div>

  <div id="nft-container"></div>
</div>

<!-- NFT Detail Modal -->
<div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast-container"></div>

<script>
  let allNFTs      = [];
  let filteredNFTs = [];
  let currentFilter = 'all';
  let collectionStats = {};

  // ── Load NFTs ──────────────────────────────────────────────────────────────
  async function loadNFTs() {
    showSkeleton();
    try {
      const res  = await fetch('/api/nfts');
      const json = await res.json();

      if (!json.ok) {
        showError(json.error);
        return;
      }

      allNFTs      = json.data || [];
      filteredNFTs = [...allNFTs];

      updateStats();
      buildCollectionFilters();
      renderGrid(filteredNFTs);
      document.getElementById('stat-refresh').textContent = new Date().toLocaleTimeString();
      document.getElementById('wallet-sub').textContent   = allNFTs.length + ' NFTs found in your wallet · ' + new Date().toLocaleString();

      // Load collection stats for collections that have an OpenSea slug
      loadCollectionStats();

    } catch (err) {
      showError('Could not reach server. Is server.js running?');
    }
  }

  // ── Load collection floor prices from OpenSea ──────────────────────────────
  async function loadCollectionStats() {
    const slugs = [...new Set(allNFTs.map(n => n.collectionSlug).filter(Boolean))];
    for (const slug of slugs.slice(0, 20)) { // limit to 20 collections
      try {
        const res  = await fetch('/api/nft/collection/' + slug);
        const json = await res.json();
        if (json.ok) {
          collectionStats[slug] = json.data;
          // Update floor prices on cards
          updateFloorPrices(slug, json.data.floorPrice);
        }
      } catch { /* skip failed collections */ }
    }
    updateStats(); // recalc total value with real floors
  }

  // ── Update floor price labels on cards ────────────────────────────────────
  function updateFloorPrices(slug, floor) {
    document.querySelectorAll('[data-slug="' + slug + '"]').forEach(el => {
      el.textContent = floor ? floor.toFixed(3) + ' ETH' : '—';
    });
  }

  // ── Stats ──────────────────────────────────────────────────────────────────
  function updateStats() {
    const collections = new Set(allNFTs.map(n => n.collection)).size;
    document.getElementById('stat-total').textContent       = allNFTs.length;
    document.getElementById('stat-collections').textContent = collections;

    // Estimated value from floor prices
    let totalEth = 0;
    allNFTs.forEach(nft => {
      const slug  = nft.collectionSlug;
      const floor = (slug && collectionStats[slug]?.floorPrice) || nft.floorPrice || 0;
      totalEth += floor;
    });
    document.getElementById('stat-value').textContent = totalEth > 0 ? totalEth.toFixed(2) + ' ETH' : 'Calculating…';

    // Highest floor
    let highestFloor = 0, highestName = '—';
    for (const [slug, stats] of Object.entries(collectionStats)) {
      if (stats.floorPrice > highestFloor) {
        highestFloor = stats.floorPrice;
        highestName  = stats.name || slug;
      }
    }
    document.getElementById('stat-floor').textContent      = highestFloor > 0 ? highestFloor.toFixed(3) + 'Ξ' : '—';
    document.getElementById('stat-floor-name').textContent = highestName;
  }

  // ── Collection filter buttons ──────────────────────────────────────────────
  function buildCollectionFilters() {
    const collections = {};
    allNFTs.forEach(n => {
      if (!collections[n.collection]) collections[n.collection] = 0;
      collections[n.collection]++;
    });

    const container = document.getElementById('collection-filters');
    container.style.display = 'flex';
    container.style.gap     = '6px';
    container.style.flexWrap = 'wrap';
    container.innerHTML = Object.entries(collections)
      .sort((a,b) => b[1]-a[1])
      .slice(0, 8)
      .map(([name, count]) =>
        `<button class="filter-btn" onclick="filterBy('${name.replace(/'/g,"\\'")}', this)">${name} <span style="color:var(--muted);margin-left:3px;">${count}</span></button>`
      ).join('');
  }

  // ── Filtering ──────────────────────────────────────────────────────────────
  function filterBy(collection, btn) {
    currentFilter = collection;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    filteredNFTs = collection === 'all' ? [...allNFTs] : allNFTs.filter(n => n.collection === collection);
    renderGrid(filteredNFTs);
  }

  function searchNFTs(query) {
    const q = query.toLowerCase();
    filteredNFTs = allNFTs.filter(n =>
      (currentFilter === 'all' || n.collection === currentFilter) &&
      (n.name?.toLowerCase().includes(q) || n.collection?.toLowerCase().includes(q))
    );
    renderGrid(filteredNFTs);
  }

  // ── Render grid ────────────────────────────────────────────────────────────
  function renderGrid(nfts) {
    const container = document.getElementById('nft-container');
    if (nfts.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#5a6070" stroke-width="1">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <h3>No NFTs found</h3>
        <p>No NFTs match your current filter.</p>
      </div>`;
      return;
    }

    container.innerHTML = '<div class="nft-grid">' + nfts.map((nft, i) => {
      const slug       = nft.collectionSlug;
      const floor      = (slug && collectionStats[slug]?.floorPrice) || nft.floorPrice;
      const floorStr   = floor ? floor.toFixed(3) + ' ETH' : '—';
      const imgHtml    = nft.image
        ? `<img class="nft-image" src="${nft.image}" alt="${nft.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : '';
      const placeholderEmoji = ['🦊','👾','🌀','🤖','🐉','🦁','🐸','💎','🌙','⚡'][i % 10];

      return `<div class="nft-card" style="animation-delay:${(i%20)*0.03}s" onclick="openModal(${i})">
        ${imgHtml}
        <div class="nft-image-placeholder" style="${nft.image ? 'display:none' : ''}">${placeholderEmoji}</div>
        <div class="nft-body">
          <div class="nft-collection">
            ${nft.collection}
            ${nft.safelistStatus === 'verified' ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="#00f5c4"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' : ''}
          </div>
          <div class="nft-name">${nft.name || '#' + nft.tokenId}</div>
          <div class="nft-footer">
            <div>
              <div class="nft-floor-label">Floor</div>
              <div class="nft-floor-value" data-slug="${slug || ''}">${floorStr}</div>
            </div>
            <div class="nft-actions">
              ${nft.openseaUrl ? `<a href="${nft.openseaUrl}" target="_blank" onclick="event.stopPropagation()" class="nft-action-btn" title="View on OpenSea">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></a>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }).join('') + '</div>';
  }

  // ── NFT Detail Modal ────────────────────────────────────────────────────────
  async function openModal(index) {
    const nft    = filteredNFTs[index];
    if (!nft) return;
    const slug   = nft.collectionSlug;
    const stats  = slug ? collectionStats[slug] : null;
    const floor  = stats?.floorPrice || nft.floorPrice || 0;
    const modal  = document.getElementById('modal');
    const content = document.getElementById('modal-content');

    const imgHtml = nft.image
      ? `<img src="${nft.image}" alt="${nft.name}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px 0 0 0;display:block;">`
      : `<div class="modal-img-placeholder" style="border-radius:18px 0 0 0">💎</div>`;

    const traitsHtml = nft.traits?.length
      ? `<div class="modal-section-title">Traits</div>
         <div class="traits-grid">${nft.traits.map(t =>
           `<div class="trait-pill"><div class="trait-type">${t.trait}</div><div class="trait-value">${t.value}</div></div>`
         ).join('')}</div>`
      : '';

    const statsHtml = stats ? `
      <div class="modal-section-title">Collection Stats</div>
      <div class="collection-stats">
        <div class="coll-stat"><div class="coll-stat-label">24h Volume</div><div class="coll-stat-value">${stats.volume24h?.toFixed(1) || '—'} ETH</div></div>
        <div class="coll-stat"><div class="coll-stat-label">7d Volume</div><div class="coll-stat-value">${stats.volume7d?.toFixed(1) || '—'} ETH</div></div>
        <div class="coll-stat"><div class="coll-stat-label">24h Sales</div><div class="coll-stat-value">${stats.sales24h || '—'}</div></div>
        <div class="coll-stat"><div class="coll-stat-label">Avg Price</div><div class="coll-stat-value">${stats.averagePrice?.toFixed(3) || '—'} ETH</div></div>
      </div>` : '';

    content.innerHTML = `
      <div class="modal-grid">
        <div class="modal-img-side">
          ${imgHtml}
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-info">
          <div>
            <div class="modal-collection">${nft.collection} ${nft.safelistStatus === 'verified' ? '✓ Verified' : ''}</div>
            <div class="modal-name">${nft.name || '#' + nft.tokenId}</div>
            ${nft.description ? `<div class="modal-desc">${nft.description.slice(0,180)}${nft.description.length > 180 ? '…' : ''}</div>` : ''}
          </div>
          <div class="price-row">
            <div class="price-box">
              <div class="price-box-label">Floor Price</div>
              <div class="price-box-value" style="color:var(--cyan)">${floor ? floor.toFixed(3) + ' ETH' : '—'}</div>
              <div class="price-box-sub">collection floor</div>
            </div>
            <div class="price-box">
              <div class="price-box-label">Token ID</div>
              <div class="price-box-value">#${nft.tokenId}</div>
              <div class="price-box-sub">${nft.tokenType || 'ERC-721'}</div>
            </div>
          </div>
          ${traitsHtml}
          ${statsHtml}
          <div class="modal-actions">
            ${nft.openseaUrl ? `<a href="${nft.openseaUrl}" target="_blank" class="modal-btn primary">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></a>
              View on OpenSea
            </a>` : ''}
            <button class="modal-btn ghost" onclick="loadHistory('${nft.contractAddress}','${nft.tokenId}')">Sale History</button>
          </div>
          <div id="history-section"></div>
        </div>
      </div>`;

    modal.classList.add('open');
  }

  async function loadHistory(contract, tokenId) {
    const section = document.getElementById('history-section');
    if (!section) return;
    section.innerHTML = '<div style="font-size:11px;color:var(--muted2);padding:8px 0">Loading history…</div>';
    try {
      const res  = await fetch(`/api/nft/history/${contract}/${tokenId}`);
      const json = await res.json();
      if (!json.ok || json.data.length === 0) {
        section.innerHTML = '<div style="font-size:11px;color:var(--muted);padding:8px 0">No sale history found.</div>';
        return;
      }
      section.innerHTML = `
        <div class="modal-section-title" style="margin-top:4px">Sale History</div>
        ${json.data.map(e => `
          <div class="history-item">
            <span class="history-type">${e.eventType}</span>
            <span class="history-date">${e.date || '—'}</span>
            <span class="history-price">${e.salePrice ? e.salePrice + ' ' + e.currency : '—'}</span>
          </div>`).join('')}`;
    } catch {
      section.innerHTML = '<div style="font-size:11px;color:var(--pink);padding:8px 0">Could not load history.</div>';
    }
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  // ── Skeleton loading ───────────────────────────────────────────────────────
  function showSkeleton() {
    document.getElementById('nft-container').innerHTML = `
      <div class="loading-grid">
        ${Array(12).fill(0).map(() => `
          <div class="skeleton">
            <div class="skeleton-img"></div>
            <div class="skeleton-body">
              <div class="skeleton-line short"></div>
              <div class="skeleton-line"></div>
              <div class="skeleton-line short"></div>
            </div>
          </div>`).join('')}
      </div>`;
  }

  // ── Error state ────────────────────────────────────────────────────────────
  function showError(msg) {
    const isKeyError = msg.includes('key') || msg.includes('API');
    document.getElementById('nft-container').innerHTML = `
      <div class="empty-state">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#5a6070" stroke-width="1">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <h3>${isKeyError ? 'API Keys Not Set' : 'Something went wrong'}</h3>
        <p>${msg}</p>
        ${isKeyError ? `<p>Open <code>server.js</code> and fill in your Alchemy API key and wallet address at the top of the file, then restart the server.</p>` : ''}
      </div>`;
    document.getElementById('wallet-sub').textContent = 'Error loading wallet';
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  loadNFTs();
</script>
</body>
</html>
